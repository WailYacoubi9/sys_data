---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: rabii10/spark-image:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: SPARK_MODE
              value: master
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
            - name: SPARK_METRICS_CONF
              value: /opt/spark/conf/metrics.properties

          command: [ "/bin/bash","-c" ]
          args:
            - |
              # Copy metrics configuration
              cp /etc/spark-metrics/metrics.properties /opt/spark/conf/metrics.properties

              # Start master
              /opt/spark/sbin/start-master.sh &&
              tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master*.out

          ports:
            - containerPort: 7077
              name: spark
            - containerPort: 8080
              name: webui
            - containerPort: 4040
              name: metrics

          volumeMounts:
            - name: metrics-config
              mountPath: /etc/spark-metrics

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

      volumes:
        - name: metrics-config
          configMap:
            name: spark-metrics-config

---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-service
  labels:
    app: spark-master
spec:
  type: ClusterIP
  selector:
    app: spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: webui
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 4040
      targetPort: 4040
