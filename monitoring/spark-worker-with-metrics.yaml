---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: rabii10/spark-image:v2
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          env:
            - name: SPARK_MODE
              value: worker
            - name: SPARK_MASTER_URL
              value: spark://spark-master-service:7077
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            - name: SPARK_WORKER_MEMORY
              value: "1G"
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: SPARK_METRICS_CONF
              value: /opt/spark/conf/metrics.properties

          command: [ "/bin/bash","-c" ]
          args:
            - |
              # Copy metrics configuration
              cp /etc/spark-metrics/metrics.properties /opt/spark/conf/metrics.properties

              # Start worker
              /opt/spark/sbin/start-worker.sh spark://spark-master-service:7077 &&
              tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out

          ports:
            - containerPort: 8081
              name: webui
            - containerPort: 4041
              name: metrics

          volumeMounts:
            - name: metrics-config
              mountPath: /etc/spark-metrics

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

      volumes:
        - name: metrics-config
          configMap:
            name: spark-metrics-config

---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker-service
  labels:
    app: spark-worker
spec:
  type: ClusterIP
  selector:
    app: spark-worker
  ports:
    - name: webui
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 4041
      targetPort: 4041
